spring.application.name=financeflow

# Conexão com o PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/financeflow
spring.datasource.username=financeflow
spring.datasource.password=financeflow

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# JWT (o segredo de dev é só pra desenvolvimento: em produção use a variável de ambiente JWT_SECRET)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.expiration-minutes=60
